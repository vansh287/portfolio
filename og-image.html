<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>og source</title>
<style>
@font-face{font-family:Gambetta;src:url('fonts/gambetta-400-italic.woff2') format('woff2');font-weight:400;font-style:italic}
@font-face{font-family:Gambetta;src:url('fonts/gambetta-700.woff2') format('woff2');font-weight:700;font-style:normal}
@font-face{font-family:Switzer;src:url('fonts/switzer-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:Switzer;src:url('fonts/switzer-600.woff2') format('woff2');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;background:#fbfaf7;color:#1c1b17;
  font-family:Switzer,Arial,sans-serif;display:grid;grid-template-columns:1fr 420px;
}
.left{padding:74px 0 60px 78px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:17px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8d8a80;margin-bottom:26px}
h1{font-family:Gambetta,serif;font-weight:700;font-size:78px;line-height:1.04;letter-spacing:-.02em;margin-bottom:16px}
.role{font-family:Gambetta,serif;font-style:italic;font-size:32px;color:#56534a;margin-bottom:34px}
.rule{width:64px;height:3px;background:#1d4f91;margin-bottom:30px}
.meta{font-size:19px;font-weight:500;color:#56534a;line-height:1.65}
.meta b{color:#1c1b17;font-weight:600}
.right{position:relative;background:#15161a;overflow:hidden}
.right img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
</style></head>
<body>
  <div class="left">
    <div class="kicker">Computer vision &middot; Medical imaging</div>
    <h1>Vansh Pandit</h1>
    <div class="role">I teach machines to read medical scans.</div>
    <div class="rule"></div>
    <div class="meta">
      <b>IISER Thiruvananthapuram</b><br>
      MICCAI 2026 HECKTOR &middot; QuantUS, TU Dresden
    </div>
  </div>
  <div class="right"><img src="img/vansh.jpg" alt=""></div>
</body></html>
